; Configuration CouchDB de développement (aucun secret de production ici).
[couchdb]
single_node = true

[chttpd]
authentication_handlers = {chttpd_auth, jwt_authentication_handler}, {chttpd_auth, cookie_authentication_handler}, {chttpd_auth, default_authentication_handler}
enable_cors = true

[cors]
origins = *
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer

[jwt_auth]
required_claims = exp
roles_claim_path = _couchdb.roles

[jwt_keys]
; clé HMAC de développement, base64 de "dev-only-secret-change-me-32-bytes!!"
hmac:dev = ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0zMi1ieXRlcyEh
