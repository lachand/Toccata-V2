name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @toccata/web check-bundle
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning -x deploy/*.sh deploy/hotspot/*.sh
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # échec sur une vulnérabilité haute ou critique des dépendances de production
      - run: pnpm audit --prod --audit-level high
  deploy-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # installation réelle de la pile de production (images construites depuis les sources, HTTPS par l'autorité locale de Caddy)
      - run: HTTP_PORT=8080 HTTPS_PORT=8443 ./deploy/install.sh --yes --build --domain localhost --tls internal
      - run: ./deploy/doctor.sh
      - run: pnpm --filter @toccata/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @toccata/e2e e2e:prod
        env: { PROD_URL: "https://localhost:8443" }
      # charge : une classe de 40 élèves en 4 groupes sur la pile de production (cas d'étude 2 de l'article)
      - run: node tools/loadtest.mjs --base https://localhost:8443 --insecure --code "$(sed -n "s/^SIGNUP_CODE='\(.*\)'/\1/p" deploy/.env)"
      - if: failure()
        run: cd deploy && docker compose logs --tail 100
  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      COUCHDB_URL: http://127.0.0.1:5984
      COUCHDB_ADMIN_USER: admin
      COUCHDB_ADMIN_PASSWORD: ci-only-admin-pass
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Deux CouchDB avec la configuration JWT de développement (clé jetable, voir infra/couchdb/local.ini) :
      # « cloud » (5984) et « serveur de classe » (5985, qui joint l'hôte par host.docker.internal : proxy coupable des tests de la Phase 6)
      - run: |
          for spec in "couch:5984" "couch-local:5985"; do
            name="${spec%%:*}"; port="${spec##*:}"
            docker run -d --name "$name" -p "$port:5984" --add-host host.docker.internal:host-gateway \
              -e COUCHDB_USER=admin -e COUCHDB_PASSWORD=ci-only-admin-pass \
              -v "$PWD/infra/couchdb/local.ini:/opt/couchdb/etc/local.d/10-toccata.ini" couchdb:3.4
            for i in $(seq 1 60); do curl -sf -u admin:ci-only-admin-pass "http://127.0.0.1:$port/" >/dev/null && break; sleep 1; done
            curl -sf -u admin:ci-only-admin-pass "http://127.0.0.1:$port/" >/dev/null || { docker logs "$name"; exit 1; }
          done
      - run: pnpm --filter @toccata/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @toccata/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results
  auth-integration:
    runs-on: ubuntu-latest
    needs: build
    env:
      COUCHDB_URL: http://127.0.0.1:5984
      COUCHDB_ADMIN_USER: admin
      COUCHDB_ADMIN_PASSWORD: ci-only-admin-pass
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Deux CouchDB avec la configuration JWT de développement (clé jetable, voir infra/couchdb/local.ini) :
      # « cloud » (5984) et « serveur de classe » (5985, qui joint l'hôte par host.docker.internal : proxy coupable des tests de la Phase 6)
      - run: |
          for spec in "couch:5984" "couch-local:5985"; do
            name="${spec%%:*}"; port="${spec##*:}"
            docker run -d --name "$name" -p "$port:5984" --add-host host.docker.internal:host-gateway \
              -e COUCHDB_USER=admin -e COUCHDB_PASSWORD=ci-only-admin-pass \
              -v "$PWD/infra/couchdb/local.ini:/opt/couchdb/etc/local.d/10-toccata.ini" couchdb:3.4
            for i in $(seq 1 60); do curl -sf -u admin:ci-only-admin-pass "http://127.0.0.1:$port/" >/dev/null && break; sleep 1; done
            curl -sf -u admin:ci-only-admin-pass "http://127.0.0.1:$port/" >/dev/null || { docker logs "$name"; exit 1; }
          done
      - run: pnpm --filter @toccata/auth test:integration
