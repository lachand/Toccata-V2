name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      COUCHDB_URL: http://127.0.0.1:5984
      COUCHDB_ADMIN_USER: admin
      COUCHDB_ADMIN_PASSWORD: ci-only-admin-pass
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Deux CouchDB avec la configuration JWT de développement (clé jetable, voir infra/couchdb/local.ini) :
      # « cloud » (5984) et « serveur de classe » (5985, qui joint l'hôte par host.docker.internal : proxy coupable des tests de la Phase 6)
      - run: |
          for spec in "couch:5984" "couch-local:5985"; do
            name="${spec%%:*}"; port="${spec##*:}"
            docker run -d --name "$name" -p "$port:5984" --add-host host.docker.internal:host-gateway \
              -e COUCHDB_USER=admin -e COUCHDB_PASSWORD=ci-only-admin-pass \
              -v "$PWD/infra/couchdb/local.ini:/opt/couchdb/etc/local.d/10-toccata.ini" couchdb:3.4
            for i in $(seq 1 60); do curl -sf -u admin:ci-only-admin-pass "http://127.0.0.1:$port/" >/dev/null && break; sleep 1; done
            curl -sf -u admin:ci-only-admin-pass "http://127.0.0.1:$port/" >/dev/null || { docker logs "$name"; exit 1; }
          done
      - run: pnpm --filter @toccata/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @toccata/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results
  auth-integration:
    runs-on: ubuntu-latest
    needs: build
    env:
      COUCHDB_URL: http://127.0.0.1:5984
      COUCHDB_ADMIN_USER: admin
      COUCHDB_ADMIN_PASSWORD: ci-only-admin-pass
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Deux CouchDB avec la configuration JWT de développement (clé jetable, voir infra/couchdb/local.ini) :
      # « cloud » (5984) et « serveur de classe » (5985, qui joint l'hôte par host.docker.internal : proxy coupable des tests de la Phase 6)
      - run: |
          for spec in "couch:5984" "couch-local:5985"; do
            name="${spec%%:*}"; port="${spec##*:}"
            docker run -d --name "$name" -p "$port:5984" --add-host host.docker.internal:host-gateway \
              -e COUCHDB_USER=admin -e COUCHDB_PASSWORD=ci-only-admin-pass \
              -v "$PWD/infra/couchdb/local.ini:/opt/couchdb/etc/local.d/10-toccata.ini" couchdb:3.4
            for i in $(seq 1 60); do curl -sf -u admin:ci-only-admin-pass "http://127.0.0.1:$port/" >/dev/null && break; sleep 1; done
            curl -sf -u admin:ci-only-admin-pass "http://127.0.0.1:$port/" >/dev/null || { docker logs "$name"; exit 1; }
          done
      - run: pnpm --filter @toccata/auth test:integration
