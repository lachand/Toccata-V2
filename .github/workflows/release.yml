name: Release
# Une étiquette vX.Y.Z publie les images (amd64 + arm64, pour Raspberry Pi) et l'archive d'installation.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: toccata-auth, file: deploy/Dockerfile.auth }
          - { name: toccata-web, file: deploy/Dockerfile.web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  bundle:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - name: Archive d'installation
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p out/toccata-deploy
          cp -r deploy/. out/toccata-deploy/
          rm -rf out/toccata-deploy/.sandbox.* out/toccata-deploy/certs/* ; touch out/toccata-deploy/certs/.gitkeep
          sed -i "s/TOCCATA_VERSION:-latest/TOCCATA_VERSION:-$v/" out/toccata-deploy/docker-compose.yml
          sed -i "s/TOCCATA_VERSION:-latest/TOCCATA_VERSION:-$v/" out/toccata-deploy/install.sh
          cp LICENSE out/toccata-deploy/
          cp docs/guide-deploiement.md docs/deployment-guide.en.md out/toccata-deploy/ 2>/dev/null || true
          tar czf "toccata-deploy-$v.tar.gz" -C out toccata-deploy
          cp "toccata-deploy-$v.tar.gz" toccata-deploy.tar.gz   # nom stable : .../releases/latest/download/toccata-deploy.tar.gz
          sha256sum toccata-deploy*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            toccata-deploy-*.tar.gz
            toccata-deploy.tar.gz
            SHA256SUMS
