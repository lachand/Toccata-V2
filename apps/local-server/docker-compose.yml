# Serveur de classe Toccata : une base CouchDB, le service d'authentification en « mode local » et Caddy (HTTPS, interface, proxy).
# Mise en route : voir docs/guide-serveur-local.md. Les secrets sont générés par ./make-secrets.sh (jamais versionnés).
name: toccata-classe
services:
  couchdb:
    image: ${COUCHDB_IMAGE:-couchdb:3.4}
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_ADMIN_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD:?lancez ./make-secrets.sh}
    volumes:
      - couchdb-data:/opt/couchdb/data
      # pas en lecture seule : l'entrypoint de CouchDB ajuste les droits des fichiers de configuration
      - ./couchdb/local.ini:/opt/couchdb/etc/local.d/10-toccata.ini
      - ./couchdb/secrets.ini:/opt/couchdb/etc/local.d/20-secrets.ini
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:5984/_up"]
      interval: 10s
      timeout: 3s
      retries: 10
    # jamais exposé hors de la machine : tout passe par Caddy (HTTPS) et par le service d'authentification
    expose: ["5984"]

  auth:
    build:
      context: ../..
      dockerfile: apps/local-server/Dockerfile.auth
    restart: unless-stopped
    depends_on:
      couchdb: { condition: service_healthy }
    environment:
      SERVER_MODE: local
      SERVER_NAME: ${SERVER_NAME:-Serveur de classe}
      PORT: "8787"
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_ADMIN_USER: ${COUCHDB_ADMIN_USER:-admin}
      COUCHDB_ADMIN_PASSWORD: ${COUCHDB_ADMIN_PASSWORD}
      # le CouchDB se désigne lui-même ainsi pour ses réplications (la source est locale, la cible est le cloud)
      LOCAL_COUCHDB_SELF_URL: http://127.0.0.1:5984
      JWT_SECRET: ${JWT_SECRET:?lancez ./make-secrets.sh}
      JWT_KID: local
      UPSTREAM_COUCHDB_URL: ${UPSTREAM_COUCHDB_URL:?adresse du CouchDB du cloud}
      UPSTREAM_ADMIN_USER: ${UPSTREAM_ADMIN_USER:?}
      UPSTREAM_ADMIN_PASSWORD: ${UPSTREAM_ADMIN_PASSWORD:?}
      TEACHER_IDS: ${TEACHER_IDS:?identifiants des enseignants servis}
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
    expose: ["8787"]

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    depends_on: [auth]
    ports: ["80:80", "443:443"]
    environment:
      SERVER_HOST: ${SERVER_HOST:?nom de domaine du serveur de classe}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-tls internal}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv/web:ro
      - ./certs:/certs:ro
      - caddy-data:/data

volumes:
  couchdb-data:
  caddy-data:
